name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install X11 build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-composite0-dev libxcb-damage0-dev libxcb-present-dev libxcb-glx0-dev pkg-config xvfb x11-utils x11-xserver-utils xfonts-base
      - uses: Swatinem/rust-cache@v2
      - name: Format and check Rust workspace
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: bash ./tests/static-check.sh
      - run: bash ./tests/installer-sandbox.sh
      - run: bash ./tests/xvfb-server-check.sh
      - run: bash ./tests/xvfb-smoke.sh
