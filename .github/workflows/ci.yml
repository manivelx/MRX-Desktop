name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install X11 build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxcb1-dev libxcb-randr0-dev libxcb-xfixes0-dev libxcb-composite0-dev libxcb-damage0-dev libxcb-present-dev libxcb-glx0-dev pkg-config xvfb x11-utils x11-xserver-utils xfonts-base xserver-xephyr jq
      - uses: Swatinem/rust-cache@v2
      - name: Format and check Rust workspace
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: bash ./tests/static-check.sh
      - run: bash ./tests/mrx-shell-backend.sh
      - run: bash ./tests/diagnostics.sh
      - run: bash ./tests/mrx-shell-capabilities.sh
      - run: bash ./tests/installer-sandbox.sh
      - run: bash ./tests/xvfb-server-check.sh
      - run: bash ./tests/xvfb-smoke.sh
      - run: bash ./tests/xephyr-smoke.sh
      - run: cargo build --release --workspace
      - run: bash ./tests/package-release.sh

  archlinux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install Arch Linux toolchain and X11 test dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel util-linux git curl pkgconf jq python \
            libx11 libxcb libxrandr libxfixes libxcomposite libxdamage libxrender libxext libxinerama libxpresent \
            xorg-server-xvfb xorg-server-xephyr xorg-xdpyinfo xorg-xprop xorg-xrandr xorg-xwininfo xorg-xauth \
            quickshell dbus procps-ng qt6-5compat qt6-positioning syntax-highlighting
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify Arch Rust toolchain
        run: rustc --version && cargo --version && rustfmt --version && cargo clippy --version
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: bash ./tests/static-check.sh
      - run: bash ./tests/mrx-shell-backend.sh
      - run: bash ./tests/diagnostics.sh
      - run: bash ./tests/mrx-shell-capabilities.sh
      - run: bash ./tests/installer-sandbox.sh
      - run: bash ./tests/xvfb-server-check.sh
      - run: bash ./tests/xvfb-smoke.sh
      - run: bash ./tests/xephyr-smoke.sh
      - run: bash ./tests/quickshell-smoke.sh
      - run: cargo build --release --workspace
      - run: bash ./tests/package-release.sh
