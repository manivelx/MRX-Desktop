name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches workspace version
        run: |
          VERSION="$(awk '/^\[workspace\.package\]$/ {p=1;next} /^\[/ {p=0} p && /^version[[:space:]]*=/ {sub(/^[^"]*"/,"");sub(/".*$/,"");print;exit}' Cargo.toml)"
          [[ "${GITHUB_REF_NAME#v}" == "$VERSION" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match workspace version $VERSION" >&2
            exit 1
          }
      - run: cargo build --release --workspace
      - name: Package reproducible release archive
        run: bash ./scripts/package-release.sh
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
