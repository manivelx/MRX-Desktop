[workspace]
resolver = "2"
members = ["crates/mrx-core", "crates/mrx-wm", "crates/mrxctl"]

[workspace.package]
version = "0.1.0-alpha.12"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
x11rb = { version = "0.14", features = ["randr", "xinput", "xfixes", "composite", "damage", "present", "dri3", "glx", "extra-traits"] }
